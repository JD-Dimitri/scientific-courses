security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Sans « property » : Symfony appelle UserRepository::loadUserByIdentifier(),
        # qui accepte l'adresse e-mail ou l'identifiant.
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # POST /api/login avec {"identifier": "e-mail ou identifiant", "password": "..."}
            json_login:
                check_path: api_login
                username_path: identifier
                password_path: password
            # 5 essais ratés en 15 minutes, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    access_control:
        - { path: ^/api/(login|register|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
